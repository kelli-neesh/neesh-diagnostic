name = "neesh-diagnostic"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Custom domain. Cloudflare creates the DNS record for you on first deploy.
routes = [
  { pattern = "diagnostic.neesh.agency", custom_domain = true }
]

# Serves the page in /public. Only /api/* runs the Worker code.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Where "Book Your Results Call" goes (GHL booking calendar link). Empty for now.
BOOKING_URL = "https://api.leadconnectorhq.com/widget/booking/dyHtlPH9B27bx5j0iy1U"
# The Neesh privacy policy page.
PRIVACY_URL = "https://neesh.agency/privacy"
# The address the results links in emails start with. Leave empty to use the
# address the visitor is on (diagnostic.neesh.agency once live).
RESULTS_BASE_URL = ""

# Secret, never put it in this file:
#   npx wrangler secret put GHL_WEBHOOK_URL
# Until it is set, submissions are logged instead of sent, and the app still works.
