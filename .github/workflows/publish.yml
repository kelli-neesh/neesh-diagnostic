name: Publish diagnostic.neesh.agency

# MANUAL PUBLISH ONLY. Pushing to this repo never publishes anything.
#
# To publish:
#   1. Open the repo's "Actions" tab on GitHub.
#   2. Pick "Publish diagnostic.neesh.agency" on the left.
#   3. Click "Run workflow".
#   4. Type PUBLISH in the box, then click the green "Run workflow" button.
#
# The tests run first. If any fail, nothing is published.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH to confirm you want to publish diagnostic.neesh.agency"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-diagnostic
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation word
        if: ${{ github.event.inputs.confirm != 'PUBLISH' }}
        run: |
          echo "::error::Confirmation was not PUBLISH, so nothing has been published. Run it again and type PUBLISH exactly."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Publish to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
